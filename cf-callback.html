<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Nexa Clips — autorização</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:680px;margin:48px auto;padding:0 20px;line-height:1.6;color:#1a1a1a;background:#fafafa}a{color:#0b57d0}nav a{margin-right:16px}footer{margin-top:48px;color:#666;font-size:.9rem}code{background:#eee;padding:2px 6px;border-radius:4px;word-break:break-all}.box{background:#fff;border:1px solid #ddd;border-radius:8px;padding:16px;margin-top:16px}button,.btn{font-size:1rem;padding:10px 16px;border-radius:6px;border:1px solid #0b57d0;background:#0b57d0;color:#fff;cursor:pointer;text-decoration:none;display:inline-block}</style></head>
<body>
<h1 id="t">Autorização recebida</h1>
<p id="p">Copie a URL desta página e cole onde for solicitado.</p>
<div class="box" id="manual"><p><code id="u"></code></p>
<button onclick="navigator.clipboard.writeText(location.href).then(()=>{this.textContent='Copiado!'})">Copiar URL</button></div>
<p id="back" hidden><a class="btn" id="backlink" href="#">Voltar ao app</a></p>
<p><a href="index.html">← Nexa Clips</a></p>
<script>
document.getElementById('u').textContent = location.href;
// Login started from the app running on this computer: the state carries the
// local port, so we send the person straight back to it.
var q = new URLSearchParams(location.search);
var m = (q.get('state') || '').match(/^l(\d{2,5})\./);
if (m) {
  var target = 'http://127.0.0.1:' + m[1] + '/auth/tiktok/callback?' + q.toString();
  document.getElementById('t').textContent = 'Voltando ao app…';
  document.getElementById('p').textContent = 'Se a página não mudar sozinha, clique no botão.';
  document.getElementById('manual').hidden = true;
  document.getElementById('backlink').href = target;
  document.getElementById('back').hidden = false;
  location.replace(target);
}
</script>
</body></html>
